services:
  postgres:
    image: postgres:16
    container_name: regenify-postgres
    environment:
      POSTGRES_USER: ${REGENIFY_POSTGRES_USER:?Set REGENIFY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${REGENIFY_POSTGRES_PASSWORD:?Set REGENIFY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${REGENIFY_POSTGRES_DB:?Set REGENIFY_POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: regenify-neo4j
    environment:
      NEO4J_AUTH: ${REGENIFY_NEO4J_AUTH:?Set REGENIFY_NEO4J_AUTH}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
